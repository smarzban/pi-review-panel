name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm test && npm run check

      - name: Pack
        run: npm pack --dry-run

      - name: Installed-package smoke run
        run: npm run smoke:installed
