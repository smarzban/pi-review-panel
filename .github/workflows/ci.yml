name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm test && npm run check
